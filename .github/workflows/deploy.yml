name: Deploy PyTorch Atlas to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out validated production source
        uses: actions/checkout@v6
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Build both production artifacts
        run: npm run build
      - name: Verify Pages and offline artifacts
        run: npm run verify:dist
      - name: Content and snippet tests
        run: npm test
      - name: Source coverage checks
        run: npm run check:coverage
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end and accessibility tests
        run: npm run test:e2e
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
