name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Build both production artifacts
        run: npm run build
      - name: Verify Pages and offline artifacts
        run: npm run verify:dist
      - name: Content and snippet tests
        run: npm test
      - name: Source coverage checks
        run: npm run check:coverage
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end and accessibility tests
        run: npm run test:e2e
